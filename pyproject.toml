[project]
name = "mro-unscheduled-removal-poc"
version = "0.1.0"
description = "Leakage-aware PoC for predicting aircraft component unscheduled removals"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "shap>=0.46",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
